[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puppet-mcp"
version = "0.1.0"
description = "MCP server for orchestrating Claude Code sessions via tmux"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.0", "rich>=13.0", "click>=8.0"]

[project.optional-dependencies]
split = ["anthropic>=0.30"]

[project.scripts]
puppet = "puppet_mcp.cli:cli"
puppet-mcp = "puppet_mcp.server:main"
puppet-mcp-worker = "puppet_mcp.worker:main"
puppet-watch = "puppet_mcp.watch:main"
puppet-lint = "puppet_mcp.compact:lint_cli"
puppet-sentinel = "puppet_mcp.sentinel:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puppet_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
